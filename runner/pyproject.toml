[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longgraph-runner"
version = "0.4.0-rc.1"
description = "Phase 1a/1b/1c runner (MockHost + PromptOnlyHost + GrokBotDualTimerHost) for compiled longgraph run directories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Samek86" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
longgraph = "longgraph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["longgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
